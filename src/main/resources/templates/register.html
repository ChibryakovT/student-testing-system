<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Регистрация — ЭСТ РТСУ')}"></head>
<body>
<div class="auth-page">
    <div th:replace="~{fragments/auth :: visual('/img/library.jpg', 'Присоединяйтесь к системе тестирования', 'Регистрация занимает минуту — после неё станут доступны тесты по вашим дисциплинам.')}"></div>

    <div class="auth-form-side">
        <div class="auth-box">
            <span class="brand-mark"><i class="bi bi-person-plus-fill"></i></span>
            <h1 class="h3 mb-1">Регистрация студента</h1>
            <p class="text-muted mb-4">Заполните данные, чтобы создать учётную запись</p>
            <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="fullName">ФИО</label>
                    <input class="form-control" th:field="*{fullName}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="row">
                    <div class="col-md-7 mb-3">
                        <label class="form-label" for="email">E-mail</label>
                        <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-5 mb-3">
                        <label class="form-label" for="groupName">Группа</label>
                        <input class="form-control" th:field="*{groupName}" placeholder="ПИ-21" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{groupName}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="recordBook">Номер зачётной книжки <span class="text-muted small">(необязательно)</span></label>
                    <input class="form-control" th:field="*{recordBook}" th:errorclass="is-invalid" maxlength="20">
                    <div class="invalid-feedback" th:errors="*{recordBook}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="username">Логин</label>
                    <input class="form-control" th:field="*{username}" th:errorclass="is-invalid" autocomplete="username">
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <input class="form-control" type="password" th:field="*{password}" th:errorclass="is-invalid"
                           autocomplete="new-password">
                    <div class="form-text">Минимум 8 символов, буквы и цифры</div>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Зарегистрироваться <i class="bi bi-arrow-right ms-1"></i></button>
            </form>
            <p class="mt-4 mb-0 text-center text-muted">Уже есть учётная запись? <a th:href="@{/login}" class="fw-semibold">Войти</a></p>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
