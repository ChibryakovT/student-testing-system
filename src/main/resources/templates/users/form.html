<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Новый пользователь — ЭСТ</title></head>
<body>
<section class="form-narrow">
    <h1 class="h3 mb-3">Новый пользователь</h1>
    <form class="card card-body" th:action="@{/users}" th:object="${form}" method="post" novalidate>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="fullName">ФИО</label>
            <input class="form-control" th:field="*{fullName}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{fullName}"></div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="email">E-mail</label>
                <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label" for="groupName">Группа</label>
                <input class="form-control" th:field="*{groupName}" th:errorclass="is-invalid">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label" for="role">Роль</label>
                <select class="form-select" th:field="*{role}">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.title}"></option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="username">Логин</label>
                <input class="form-control" th:field="*{username}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{username}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="password">Пароль</label>
                <input class="form-control" type="password" th:field="*{password}" th:errorclass="is-invalid" autocomplete="new-password">
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Создать</button>
            <a class="btn btn-outline-secondary" th:href="@{/users}">Отмена</a>
        </div>
    </form>
</section>
</body>
</html>
