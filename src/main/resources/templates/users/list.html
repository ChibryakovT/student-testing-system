<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Пользователи — ЭСТ</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0 page-title"><i class="bi bi-people"></i>Пользователи</h1>
        <a class="btn btn-primary" th:href="@{/users/new}"><i class="bi bi-person-plus me-1"></i>Добавить</a>
    </div>
    <form class="card card-body mb-3 filter-bar" method="get" th:action="@{/users}">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small" for="q">Поиск</label>
                <input class="form-control" id="q" name="q" th:value="${q}" placeholder="ФИО, логин или группа">
            </div>
            <div class="col-md-2">
                <label class="form-label small" for="groupId">Группа</label>
                <select class="form-select" id="groupId" name="groupId">
                    <option value="">Все группы</option>
                    <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.name}" th:selected="${g.id == groupId}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small" for="role">Роль</label>
                <select class="form-select" id="role" name="role">
                    <option value="">Все роли</option>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.title}" th:selected="${r == role}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small" for="sort">Сортировка</label>
                <select class="form-select" id="sort" name="sort">
                    <option value="name" th:selected="${sort == 'name'}">По ФИО</option>
                    <option value="username" th:selected="${sort == 'username'}">По логину</option>
                    <option value="role" th:selected="${sort == 'role'}">По роли</option>
                    <option value="created" th:selected="${sort == 'created'}">Новые</option>
                </select>
            </div>
            <div class="col-md-2"><button class="btn btn-primary w-100" type="submit"><i class="bi bi-search me-1"></i>Найти</button></div>
        </div>
    </form>
    <div class="table-responsive card reveal">
        <table class="table table-hover mb-0 align-middle">
            <thead><tr><th>ФИО</th><th>Логин</th><th>E-mail</th><th>Группа / кафедра</th><th>№ зачётки</th><th>Роль и доступ</th><th><span class="visually-hidden">Действия</span></th></tr></thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.fullName}">ФИО</td>
                <td th:text="${u.username}">логин</td>
                <td th:text="${u.email}">email</td>
                <td><span th:if="${u.group != null}" class="badge text-bg-light" th:text="${u.group.name}">группа</span>
                    <span th:if="${u.department != null}" class="small text-muted" th:text="${u.department.name}">кафедра</span></td>
                <td th:text="${u.recordBook}">зачётка</td>
                <td>
                    <form class="d-flex gap-2 align-items-center" th:action="@{/users/{id}(id=${u.id})}" method="post">
                        <select class="form-select form-select-sm" name="role" aria-label="Роль">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.title}" th:selected="${r == u.role}"></option>
                        </select>
                        <div class="form-check form-switch m-0" title="Активен">
                            <input class="form-check-input" type="checkbox" name="enabled" value="true" aria-label="Учётная запись активна" th:checked="${u.enabled}">
                        </div>
                        <button class="btn btn-sm btn-outline-primary" type="submit">OK</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{/users/{id}/delete(id=${u.id})}" method="post" data-confirm="Удалить пользователя?">
                        <button aria-label="Удалить" class="btn btn-sm btn-outline-danger" type="submit" title="Удалить"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:replace="~{fragments/pager :: pager(${pager})}"></nav>
</section>
</body>
</html>
