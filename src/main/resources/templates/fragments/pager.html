<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Навигация по страницам списка: pager — объект ru.edu.testing.web.Pager -->
<nav th:fragment="pager(p)" class="pager-bar" th:if="${p.total > 0}" aria-label="Страницы">
    <span class="small text-muted" th:text="'Показано ' + ${p.from} + '–' + ${p.to} + ' из ' + ${p.total}">1–50 из 134</span>
    <ul class="pagination pagination-sm mb-0" th:if="${p.pages > 1}">
        <li class="page-item" th:classappend="${p.page == 1} ? 'disabled'">
            <a class="page-link" th:href="${p.url(p.page - 1)}" aria-label="Предыдущая">‹</a></li>
        <li class="page-item" th:each="n : ${p.numbers()}" th:classappend="${n == p.page} ? 'active' : (${n == 0} ? 'disabled')">
            <a class="page-link" th:if="${n > 0}" th:href="${p.url(n)}" th:text="${n}" th:attr="aria-current=${n == p.page} ? 'page' : null">1</a>
            <span class="page-link" th:if="${n == 0}">…</span></li>
        <li class="page-item" th:classappend="${p.page == p.pages} ? 'disabled'">
            <a class="page-link" th:href="${p.url(p.page + 1)}" aria-label="Следующая">›</a></li>
    </ul>
</nav>
</body>
</html>
