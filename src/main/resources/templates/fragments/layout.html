<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Тестирование</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body th:classappend="${me != null} ? 'with-sidebar'">

<th:block th:if="${me != null}">
    <!-- Компьютер: постоянное меню слева -->
    <aside class="sidebar d-none d-lg-flex">
        <div th:replace="~{fragments/nav :: nav}"></div>
    </aside>
    <!-- Телефон: верхняя полоса и выезжающее меню -->
    <header class="topbar d-lg-none">
        <button class="btn btn-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="Меню">
            <i class="bi bi-list fs-5"></i></button>
        <a class="d-flex align-items-center gap-2 text-decoration-none text-reset fw-bold" th:href="@{/}">
            <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>ЭСТ · РТСУ</a>
        <span style="width:42px"></span>
    </header>
    <div class="offcanvas offcanvas-start sidebar-offcanvas" tabindex="-1" id="mobileNav">
        <div th:replace="~{fragments/nav :: nav}"></div>
    </div>
</th:block>

<div class="app-main">
    <main class="app-content page-enter" th:classappend="${me == null} ? 'container py-4'">
        <th:block th:replace="${content}"></th:block>
    </main>
    <footer class="app-footer">
        <span><i class="bi bi-mortarboard me-1"></i>Электронная система тестирования студентов · РТСУ</span>
        <a th:href="@{/credits}"><i class="bi bi-camera me-1"></i>Фото и лицензии</a>
    </footer>
</div>

<div class="toast-stack" aria-live="polite">
    <div class="toast-msg" th:if="${success}" data-autohide>
        <i class="bi bi-check-circle-fill"></i><div th:text="${success}">успех</div>
    </div>
    <div class="toast-msg error" th:if="${errorMessage}" data-autohide>
        <i class="bi bi-exclamation-triangle-fill"></i><div th:text="${errorMessage}">ошибка</div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
