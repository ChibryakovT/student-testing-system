<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Тестирование</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary-subtle app-navbar" th:if="${me != null}">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">ЭСТ · Тестирование</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tests}">Тесты</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/attempts}"
                                        th:text="${me.student} ? 'Мои результаты' : 'Результаты'">Результаты</a></li>
                <li class="nav-item" th:if="${me.staff}"><a class="nav-link" th:href="@{/subjects}">Дисциплины</a></li>
                <li class="nav-item" th:if="${me.staff}"><a class="nav-link" th:href="@{/reports}">Отчёты</a></li>
                <li class="nav-item" th:if="${me.admin}"><a class="nav-link" th:href="@{/users}">Пользователи</a></li>
            </ul>
            <span class="navbar-text me-3 small">
                <span th:text="${me.fullName}">Пользователь</span>
                <span class="badge text-bg-light ms-1" th:text="${me.role.title}">роль</span>
            </span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-sm btn-outline-light" type="submit">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <th:block th:replace="${content}"></th:block>
</main>

<footer class="container pb-4 text-muted small">
    Электронная система тестирования студентов · Spring Boot + PostgreSQL
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
