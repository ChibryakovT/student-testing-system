<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Результаты — ЭСТ</title></head>
<body>
<section>
    <div class="page-head"><div>
        <h1 class="h3 page-title"><i class="bi bi-bar-chart-line"></i><span th:text="${me.student} ? 'Мои результаты' : 'Результаты тестирования'">Результаты</span></h1>
        <p class="subtitle" th:text="${me.student} ? 'Нажмите на строку, чтобы увидеть разбор ответов'
            : (${me.admin} ? 'Все результаты. Нажмите на строку, чтобы открыть разбор' : 'Результаты ваших групп по вашим дисциплинам. Нажмите на строку, чтобы открыть разбор')">подсказка</p>
    </div></div>
    <form class="card card-body mb-3 filter-bar" method="get" th:action="@{/attempts}">
        <div class="row g-2 align-items-end">
            <div th:class="${me.admin} ? 'col-md-2' : 'col-md-3'">
                <label class="form-label small" for="q">Поиск</label>
                <input class="form-control" id="q" name="q" th:value="${q}" placeholder="ФИО, группа или тест">
            </div>
            <div class="col-md-2">
                <label class="form-label small" for="subjectId">Дисциплина</label>
                <select class="form-select" id="subjectId" name="subjectId">
                    <option value="">Все</option>
                    <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id == subjectId}"></option>
                </select>
            </div>
            <div th:class="${me.admin} ? 'col-md-1' : 'col-md-2'">
                <label class="form-label small" for="testId">Тест</label>
                <select class="form-select" id="testId" name="testId">
                    <option value="">Все</option>
                    <option th:each="t : ${tests}" th:value="${t.id}" th:text="${t.title}" th:selected="${t.id == testId}"></option>
                </select>
            </div>
            <div class="col-md-2" th:if="${me.admin}">
                <label class="form-label small" for="groupId">Группа</label>
                <select class="form-select" id="groupId" name="groupId">
                    <option value="">Все группы</option>
                    <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.name}" th:selected="${g.id == groupId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small" for="passed">Итог</label>
                <select class="form-select" id="passed" name="passed">
                    <option value="">Любой</option>
                    <option value="true" th:selected="${passed == true}">Сдан</option>
                    <option value="false" th:selected="${passed == false}">Не сдан</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small" for="sort">Сортировка</label>
                <select class="form-select" id="sort" name="sort">
                    <option value="date" th:selected="${sort == 'date'}">По дате</option>
                    <option value="score" th:selected="${sort == 'score'}">Балл ↓</option>
                    <option value="score_asc" th:selected="${sort == 'score_asc'}">Балл ↑</option>
                    <option value="student" th:selected="${sort == 'student'}">По студенту</option>
                    <option value="test" th:selected="${sort == 'test'}">По тесту</option>
                </select>
            </div>
            <div class="col-md-1"><button aria-label="Применить" class="btn btn-primary w-100" type="submit" title="Применить"><i class="bi bi-funnel"></i></button></div>
        </div>
    </form>
    <div class="table-responsive card reveal">
        <table class="table table-hover mb-0 align-middle clickable-rows">
            <thead>
            <tr><th>Тест</th><th>Дисциплина</th><th th:if="${me.staff}">Студент</th><th th:if="${me.staff}">Группа</th>
                <th>Дата</th><th>Баллы</th><th>%</th><th>Итог</th><th><span class="visually-hidden">Действия</span></th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${attempts}" th:attr="data-href=@{/attempts/{id}/result(id=${a.id})}">
                <td th:text="${a.test.title}">тест</td>
                <td th:text="${a.test.subject.name}">дисциплина</td>
                <td th:if="${me.staff}" th:text="${a.student.fullName}">студент</td>
                <td th:if="${me.staff}" th:text="${a.student.groupName}">группа</td>
                <td class="text-nowrap" th:text="${@time.ago(a.finishedAt)}" th:title="${@time.full(a.finishedAt)}">дата</td>
                <th:block th:if="${me.staff or a.released}">
                <td th:text="${a.score} + ' / ' + ${a.maxScore}">0</td>
                <td th:text="${a.percent}">0</td>
                <td><span class="badge" th:classappend="${a.passed} ? 'text-bg-success' : 'text-bg-danger'"
                          th:text="${a.passed} ? 'сдан' : 'не сдан'">итог</span>
                    <span class="badge text-bg-warning" th:if="${!a.released}" title="Студент пока не видит оценку">не опубликован</span></td>
                </th:block>
                <td th:unless="${me.staff or a.released}" colspan="3"><span class="badge text-bg-warning">на проверке</span></td>
                <td class="text-nowrap">
                    
                    <form class="d-inline" th:if="${me.staff}" th:action="@{/attempts/{id}/delete(id=${a.id})}" method="post"
                          data-undo="Результат удалён" data-undo-target="tr">
                        <button aria-label="Удалить" class="btn btn-sm btn-outline-danger" type="submit" title="Удалить"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(attempts)}"><td colspan="9"><div class="empty-state"><i class="bi bi-search"></i>Результаты не найдены</div></td></tr>
            </tbody>
        </table>
    </div>
    <nav th:replace="~{fragments/pager :: pager(${pager})}"></nav>
    <p class="text-muted small mt-2" th:text="'Записей: ' + ${#lists.size(attempts)}"></p>
</section>
</body>
</html>
