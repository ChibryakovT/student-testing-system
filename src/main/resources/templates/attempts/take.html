<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Прохождение теста — ЭСТ</title></head>
<body>
<section class="form-narrow mx-auto">
    <div class="sticky-timer">
        <div class="d-flex justify-content-between align-items-center gap-3">
            <div>
                <div class="small text-muted" th:text="${attempt.test.subject.name}">дисциплина</div>
                <h1 class="h5 mb-0" th:text="${attempt.test.title}">тест</h1>
            </div>
            <div class="timer badge text-bg-warning fs-6" id="timer" th:attr="data-seconds=${secondsLeft}">
                <i class="bi bi-stopwatch me-1"></i><span>--:--</span></div>
        </div>
        <div class="d-flex align-items-center gap-2 small text-muted mt-2">
            <span id="answered-label" th:text="'Отвечено 0 из ' + ${#lists.size(attempt.test.questions)}">Отвечено</span>
        </div>
        <div class="progress answer-progress"><div class="progress-bar bg-success" id="answered-bar" style="width:0"></div></div>
    </div>

    <form id="attempt-form" th:action="@{/attempts/{id}/submit(id=${attempt.id})}" method="post">
        <div class="card mb-3 question-take reveal" th:each="q, st : ${attempt.test.questions}" th:attr="data-question=${q.id}">
            <div class="card-body">
                <div class="d-flex justify-content-between gap-2 mb-1">
                    <div class="fw-semibold"><span class="text-primary" th:text="${st.count} + '.'"></span> <span th:text="${q.text}">вопрос</span></div>
                    <span class="badge text-bg-light text-nowrap" th:text="${q.points} + ' б.'">1 б.</span>
                </div>
                <div class="small text-muted mb-2"
                     th:text="${q.type.name() == 'MULTIPLE'} ? 'Выберите все правильные варианты' : 'Выберите один вариант'">подсказка</div>
                <div class="form-check" th:each="o : ${q.options}">
                    <input class="form-check-input" th:type="${q.type.name() == 'MULTIPLE'} ? 'checkbox' : 'radio'"
                           th:name="'q' + ${q.id}" th:value="${o.id}" th:id="'o' + ${o.id}">
                    <label class="form-check-label" th:for="'o' + ${o.id}" th:text="${o.text}">вариант</label>
                </div>
            </div>
        </div>
        <button class="btn btn-success btn-lg px-4" type="submit" data-confirm="Завершить тест и отправить ответы?">
            <i class="bi bi-send-check me-1"></i>Завершить тест</button>
    </form>
</section>
</body>
</html>
