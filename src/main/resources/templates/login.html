<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Вход — ЭСТ</title></head>
<body>
<section class="auth-card">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Электронная система тестирования</h1>
            <p class="text-muted mb-4">Войдите, чтобы продолжить</p>

            <div class="alert alert-danger" th:if="${param.error}">Неверный логин или пароль</div>
            <div class="alert alert-warning" th:if="${param.locked}">
                Слишком много неудачных попыток. Вход временно заблокирован на 5 минут
            </div>
            <div class="alert alert-warning" th:if="${param.disabled}">Учётная запись заблокирована администратором</div>
            <div class="alert alert-info" th:if="${param.logout}">Вы вышли из системы</div>

            <form th:action="@{/login}" method="post" autocomplete="on">
                <div class="mb-3">
                    <label class="form-label" for="username">Логин</label>
                    <input class="form-control" id="username" name="username" required maxlength="50" autofocus
                           autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <input class="form-control" id="password" name="password" type="password" required maxlength="72"
                           autocomplete="current-password">
                </div>
                <button class="btn btn-primary w-100" type="submit">Войти</button>
            </form>
            <p class="mt-3 mb-0 text-center small">
                Нет учётной записи? <a th:href="@{/register}">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</section>
</body>
</html>
