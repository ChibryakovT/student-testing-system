<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Вход — ЭСТ РТСУ')}"></head>
<body>
<div class="auth-page">
    <div th:replace="~{fragments/auth :: visual('/img/hero-rtsu.jpg', 'Электронная система тестирования студентов', 'Контроль знаний онлайн: от создания теста до ведомости группы.')}"></div>

    <div class="auth-form-side">
        <div class="auth-box">
            <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
            <h1 class="h3 mb-1">С возвращением!</h1>
            <p class="text-muted mb-4">Войдите, чтобы продолжить</p>

            <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
            <div class="alert alert-danger" th:if="${param.error}"><i class="bi bi-x-circle me-1"></i>Неверный логин или пароль</div>
            <div class="alert alert-warning" th:if="${param.locked}"><i class="bi bi-lock me-1"></i>Слишком много неудачных попыток. Вход временно заблокирован на 5 минут</div>
            <div class="alert alert-warning" th:if="${param.disabled}"><i class="bi bi-slash-circle me-1"></i>Учётная запись заблокирована администратором</div>
            <div class="alert alert-info" th:if="${param.logout}"><i class="bi bi-door-open me-1"></i>Вы вышли из системы</div>

            <form th:action="@{/login}" method="post" autocomplete="on">
                <div class="mb-3">
                    <label class="form-label" for="username">Логин</label>
                    <div class="input-icon"><i class="bi bi-person"></i>
                        <input class="form-control" id="username" name="username" required maxlength="50" autofocus autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Пароль</label>
                    <div class="input-icon"><i class="bi bi-key"></i>
                        <input class="form-control" id="password" name="password" type="password" required maxlength="72" autocomplete="current-password">
                    </div>
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Войти <i class="bi bi-arrow-right ms-1"></i></button>
            </form>
            <p class="mt-4 mb-0 text-center text-muted">
                Нет учётной записи? <a th:href="@{/register}" class="fw-semibold">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
