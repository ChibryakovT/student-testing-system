<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Дисциплины — ЭСТ</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0 page-title"><i class="bi bi-book"></i>Справочник дисциплин</h1>
        <a class="btn btn-primary" th:href="@{/subjects/new}"><i class="bi bi-plus-lg me-1"></i>Добавить</a>
    </div>
    <form class="d-flex gap-2 mb-3" method="get" th:action="@{/subjects}">
        <input class="form-control" name="q" th:value="${q}" placeholder="Поиск по названию">
        <select class="form-select w-auto" name="controlForm" aria-label="Форма контроля">
            <option value="">Все формы контроля</option>
            <option th:each="f : ${controlForms}" th:value="${f}" th:text="${f.title}" th:selected="${f == controlForm}"></option>
        </select>
        <button class="btn btn-outline-primary" type="submit">Найти</button>
    </form>
    <div class="table-responsive card reveal">
        <table class="table table-hover mb-0 align-middle">
            <thead><tr><th>ID</th><th>Название</th><th>Форма контроля</th><th>Описание</th><th></th></tr></thead>
            <tbody>
            <tr th:each="s : ${subjects}">
                <td th:text="${s.id}">1</td>
                <td class="fw-semibold" th:text="${s.name}">название</td>
                <td><span class="badge" th:text="${s.controlForm.title}"
                          th:classappend="${s.controlForm.name() == 'EXAM'} ? 'text-bg-primary' : (${s.controlForm.name() == 'CREDIT'} ? 'text-bg-success' : 'text-bg-info')">форма</span></td>
                <td class="text-muted" th:text="${s.description}">описание</td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/subjects/{id}/edit(id=${s.id})}"><i class="bi bi-pencil"></i> Изменить</a>
                    <form class="d-inline" th:action="@{/subjects/{id}/delete(id=${s.id})}" method="post" data-confirm="Удалить дисциплину?">
                        <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(subjects)}"><td colspan="5" class="text-muted">Ничего не найдено</td></tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
