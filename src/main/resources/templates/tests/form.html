<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Тест — ЭСТ</title></head>
<body>
<section class="form-narrow">
    <h1 class="h3 mb-3" th:text="${testId == null} ? 'Новый тест' : 'Редактирование теста'">Тест</h1>
    <form class="card card-body" th:object="${form}" method="post"
          th:action="${testId == null} ? @{/tests} : @{/tests/{id}(id=${testId})}" novalidate>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="title">Название</label>
            <input class="form-control" th:field="*{title}" th:errorclass="is-invalid" maxlength="200">
            <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Описание</label>
            <textarea class="form-control" rows="3" th:field="*{description}" th:errorclass="is-invalid" maxlength="1000"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="subjectId">Дисциплина</label>
                <select class="form-select" th:field="*{subjectId}" th:errorclass="is-invalid">
                    <option value="">— выберите —</option>
                    <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}">дисциплина</option>
                </select>
                <div class="invalid-feedback" th:errors="*{subjectId}"></div>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label" for="timeLimitMinutes">Время, мин</label>
                <input class="form-control" type="number" min="1" max="300" th:field="*{timeLimitMinutes}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{timeLimitMinutes}"></div>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label" for="passingScore">Проходной, %</label>
                <input class="form-control" type="number" min="0" max="100" th:field="*{passingScore}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{passingScore}"></div>
            </div>
        </div>
        <div class="form-check mb-3" th:if="${testId != null}">
            <input class="form-check-input" type="checkbox" th:field="*{published}">
            <label class="form-check-label" for="published1">Опубликовать (тест станет доступен студентам)</label>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Сохранить</button>
            <a class="btn btn-outline-secondary" th:href="${testId == null} ? @{/tests} : @{/tests/{id}(id=${testId})}">Отмена</a>
        </div>
    </form>
</section>
</body>
</html>
