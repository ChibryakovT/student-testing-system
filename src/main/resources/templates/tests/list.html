<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Тесты — ЭСТ</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Каталог тестов</h1>
        <a class="btn btn-primary" th:href="@{/tests/new}" th:if="${me.staff}">+ Создать тест</a>
    </div>

    <form class="card card-body mb-3 filter-bar" method="get" th:action="@{/tests}">
        <div class="row g-2 align-items-end">
            <div class="col-md-5">
                <label class="form-label small" for="q">Поиск по названию</label>
                <input class="form-control" id="q" name="q" th:value="${q}" placeholder="Например, SQL">
            </div>
            <div class="col-md-3">
                <label class="form-label small" for="subjectId">Дисциплина</label>
                <select class="form-select" id="subjectId" name="subjectId">
                    <option value="">Все дисциплины</option>
                    <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}"
                            th:selected="${s.id == subjectId}">дисциплина</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small" for="sort">Сортировка</label>
                <select class="form-select" id="sort" name="sort">
                    <option value="new" th:selected="${sort == 'new'}">Сначала новые</option>
                    <option value="old" th:selected="${sort == 'old'}">Сначала старые</option>
                    <option value="title" th:selected="${sort == 'title'}">По названию</option>
                    <option value="subject" th:selected="${sort == 'subject'}">По дисциплине</option>
                    <option value="time" th:selected="${sort == 'time'}">По времени</option>
                </select>
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button class="btn btn-primary flex-fill" type="submit">Найти</button>
                <a class="btn btn-outline-secondary" th:href="@{/tests}" title="Сбросить">×</a>
            </div>
        </div>
    </form>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="t : ${tests}">
            <div class="card h-100 test-card">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="badge text-bg-light" th:text="${t.subject.name}">дисциплина</span>
                        <span class="badge" th:classappend="${t.published} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${t.published} ? 'Опубликован' : 'Черновик'" th:if="${me.staff}">статус</span>
                    </div>
                    <h2 class="h5" th:text="${t.title}">Название</h2>
                    <p class="text-muted small flex-grow-1" th:text="${t.description}">описание</p>
                    <div class="small text-muted mb-3">
                        <span th:text="${#lists.size(t.questions)} + ' вопр.'">0 вопр.</span> ·
                        <span th:text="${t.timeLimitMinutes} + ' мин'">0 мин</span> ·
                        проходной <span th:text="${t.passingScore} + '%'">0%</span>
                    </div>
                    <a class="btn btn-outline-primary btn-sm" th:href="@{/tests/{id}(id=${t.id})}">Открыть</a>
                </div>
            </div>
        </div>
    </div>
    <div class="alert alert-light border" th:if="${#lists.isEmpty(tests)}">По заданным условиям тесты не найдены</div>
    <p class="text-muted small mt-3" th:text="'Найдено тестов: ' + ${#lists.size(tests)}"></p>
</section>
</body>
</html>
